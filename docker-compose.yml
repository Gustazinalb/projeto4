services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-proj}
      MARIADB_USER: ${MYSQL_APP_USER:?Configure MYSQL_APP_USER no .env}
      MARIADB_PASSWORD: ${MYSQL_APP_PASSWORD:?Configure MYSQL_APP_PASSWORD no .env}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configure MYSQL_ROOT_PASSWORD no .env}
    volumes:
      - dados_mariadb:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - rede_interna
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-proj}
      DB_USER: ${MYSQL_APP_USER:?Configure MYSQL_APP_USER no .env}
      DB_PASSWORD: ${MYSQL_APP_PASSWORD:?Configure MYSQL_APP_PASSWORD no .env}
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET no .env}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rede_interna

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - rede_interna

volumes:
  dados_mariadb:

networks:
  rede_interna:
    driver: bridge
